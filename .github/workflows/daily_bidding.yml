name: 日招标项目筛选（每日 18:00 北京）

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  daily-bidding:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-jobs.txt

      - name: 运行日招标筛选
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: python jobs/daily_bidding.py

      - name: 提交主表/历史更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bidding/master_bids.json \
                  data/bidding/daily_history.json \
                  data/bidding/daily_last_run.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "日招标筛选更新 [skip ci]"
            git push
          fi
