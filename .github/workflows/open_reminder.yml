name: 招标项目提醒（每日 09:00 北京）

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  open-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-jobs.txt

      - name: 运行明日开标提醒
        env:
          SCKEY: ${{ secrets.SCKEY }}
        run: python jobs/open_reminder.py

      - name: 提交运行记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bidding/reminder_last_run.json
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "开标提醒运行记录 [skip ci]"
            git push
          fi
