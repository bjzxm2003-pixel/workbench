name: 今日头条文案包（每日 23:00 北京）

on:
  schedule:
    # 北京时间 23:00 = UTC 15:00
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  toutiao-copy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-jobs.txt

      - name: 运行今日头条文案包
        env:
          SCKEY: ${{ secrets.SCKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOUTIAO_SEARCH_API: ${{ secrets.TOUTIAO_SEARCH_API }}
        run: python jobs/toutiao_copy.py

      - name: 提交报告与运行记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/media/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "今日头条文案包 [skip ci]"
            git push
          fi
