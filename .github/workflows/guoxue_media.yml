name: 国学经典自媒体日报（每日 16:00 北京）

on:
  schedule:
    # 北京时间 16:00 = UTC 08:00
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  guoxue-media:
    runs-on: ubuntu-latest
    # 显式授予写权限：默认 GITHUB_TOKEN 可能只读，会导致最后的 git push 失败、报告回不了仓库
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-jobs.txt

      - name: 运行国学爆款日报
        env:
          SCKEY: ${{ secrets.SCKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python jobs/guoxue_media.py

      - name: 提交报告与运行记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/media/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "国学爆款日报 [skip ci]"
            git push
          fi
