name: 银发康养自媒体日报（每日 17:00 北京）

on:
  schedule:
    # 北京时间 17:00 = UTC 09:00
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  silver-media:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements-jobs.txt

      - name: 运行银发康养日报
        env:
          SCKEY: ${{ secrets.SCKEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python jobs/silver_media.py

      - name: 提交报告与运行记录
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/media/
          if git diff --staged --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "银发康养日报 [skip ci]"
            git push
          fi
